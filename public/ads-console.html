<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올잇 광고 관제판</title>
<style>
 :root{--bg:#0B1220;--card:#111A2E;--line:#1E2A44;--tx:#E2E8F0;--mut:#7C8CA8;--blue:#3B82F6;--green:#34D399;--red:#F87171;--amber:#FBBF24}
 body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:20px 24px;line-height:1.5}
 h1{font-size:19px;margin:0 8px 0 0;display:inline-block}
 .at{color:var(--mut);font-size:12px}
 .cards{display:flex;gap:12px;margin:14px 0;flex-wrap:wrap}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
 .card .l{font-size:11px;color:var(--mut);font-weight:700}
 .card .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
 .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
 #q{flex:1;min-width:220px;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);outline:none}
 #q:focus{border-color:var(--blue)}
 .chip{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--mut)}
 .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
 button.rf{font-size:12px;font-weight:900;padding:8px 14px;border-radius:10px;border:none;background:var(--blue);color:#fff;cursor:pointer}
 table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:12.5px}
 th{background:#0E1730;text-align:right;padding:8px 10px;font-size:11px;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none}
 th:first-child,th:nth-child(2){text-align:left}
 td{padding:6px 10px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 td:first-child{text-align:left;font-weight:700}
 td:nth-child(2){text-align:left;color:var(--mut);font-size:11.5px}
 .g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.m{color:var(--mut)}
 .win{color:var(--green);font-weight:900}
 .lose{color:var(--red);font-weight:900}
 #login{max-width:380px;margin:80px auto;text-align:center}
 #login input{width:100%;box-sizing:border-box;font-size:15px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin:12px 0}
 .more{padding:12px;text-align:center;color:var(--blue);font-weight:900;cursor:pointer}
 .err{color:var(--red);font-weight:800;margin:20px 0}
</style></head><body>

<div id="login" style="display:none">
  <h1>광고 관제판</h1>
  <p class="at">접속 비밀번호를 입력하세요. 한 번만 입력하면 이 컴퓨터에 저장됩니다.</p>
  <input id="tokIn" type="password" placeholder="비밀번호">
  <button class="rf" onclick="saveTok()">들어가기</button>
</div>

<div id="app" style="display:none">
  <h1>광고 관제판</h1><span class="at" id="at"></span>
  <div id="pulse" style="margin:8px 0;font-size:12.5px;font-weight:700;color:var(--mut)"></div>
  <div class="cards" id="cards"></div>
  <div class="cards" id="grpcards" style="gap:8px"></div>
  <div id="issues" style="margin:6px 0 12px"></div>
  <div class="bar">
    <input id="q" placeholder="🔍 키워드 검색 — 일산, 논현동, 청소…">
    <span class="chip on" data-f="all">전체</span>
    <span class="chip" data-f="spend">오늘 돈 쓴 것</span>
    <span class="chip" data-f="lose">1위 뺏긴 것</span>
    <span class="chip" data-f="off">꺼진 것 보기</span>
    <button class="rf" onclick="load()">↻ 새로고침</button>
    <button class="rf" id="mgBtn" style="background:#334155" onclick="toggleManage()">🔧 관리 모드</button>
  </div>
  <div class="bar" id="grpChips"></div>
  <table><thead><tr>
    <th data-s="kw">키워드</th><th data-s="grp">그룹</th>
    <th data-s="vol">월 검색량</th>
    <th data-s="bid">내 입찰가</th><th data-s="top1">1위 가격</th><th data-s="gap">판정</th>
    <th data-s="imp">오늘 노출</th><th data-s="clk">클릭</th><th data-s="cost">비용</th><th data-s="rnk">순위</th>
    <th id="mgCol" style="display:none">관리</th>
  </tr></thead><tbody id="tb"></tbody></table>
  <div class="more" id="more" style="display:none">더 보기</div>
  <div class="err" id="err"></div>
</div>

<div id="histPanel" style="display:none;position:fixed;right:24px;top:80px;width:440px;max-width:90vw;
  background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:16px;z-index:50;
  box-shadow:0 10px 40px rgba(0,0,0,.5)">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b id="histTitle" style="font-size:14px"></b>
    <span style="cursor:pointer;color:var(--mut);font-weight:900" onclick="document.getElementById('histPanel').style.display='none'">✕ 닫기</span>
  </div>
  <div id="histBody" style="margin-top:10px;font-size:12px;color:var(--mut)"></div>
  <svg id="histSvg" width="100%" height="180" viewBox="0 0 408 180" style="margin-top:8px"></svg>
</div>

<script>
let TOK=localStorage.getItem('adconsole_tok')||'';
let DATA=[],gsel=null,fsel='all',sortK='cost',sortD=-1,shown=150;
const $=id=>document.getElementById(id);
function saveTok(){TOK=$('tokIn').value.trim();localStorage.setItem('adconsole_tok',TOK);boot();}
function boot(){ if(!TOK){$('login').style.display='block';$('app').style.display='none';return;}
  $('login').style.display='none';$('app').style.display='block';load(); }
async function load(){
  $('err').textContent='';$('at').textContent='불러오는 중… (10초쯤 걸립니다)';
  try{
    const r=await fetch('/api/ad-console?token='+encodeURIComponent(TOK),{cache:'no-store'});
    if(r.status===404){localStorage.removeItem('adconsole_tok');TOK='';boot();return;}
    const j=await r.json();
    if(!j.ok){$('err').textContent='오류: '+j.error;return;}
    DATA=j.rows.map(d=>({...d,gap:(d.top1!=null)?(d.bid-d.top1):null}));
    $('at').textContent=j.today+' 기준 · '+new Date(j.at).toLocaleTimeString('ko-KR')+' 갱신 · '+j.count+'개';
    if(j.lastRun){const m=Math.round((Date.now()-new Date(j.lastRun.at))/60000);
      $('pulse').innerHTML='🟢 <b style="color:var(--green)">1위 자동맞춤 살아있음</b> — '
        +(m<1?'방금':m+'분 전')+' 실행 · 감시 '+j.lastRun.watched+'개 · 변경 '+j.lastRun.changed+'개 · 상한정지 '+j.lastRun.capped+'개';
    }else{$('pulse').innerHTML='⏳ 자동맞춤 기록 대기 중 (첫 자동 실행은 매시간 7분)';}
    buildGrpChips();render();
  }catch(e){$('err').textContent='서버 연결 실패: '+e;}
}
function buildGrpChips(){
  const gs=[...new Set(DATA.map(d=>d.grp))];
  $('grpChips').innerHTML='';
  gs.forEach(g=>{const s=document.createElement('span');s.className='chip'+(gsel===g?' on':'');s.textContent=g;
    s.onclick=()=>{gsel=(gsel===g?null:g);buildGrpChips();render();};$('grpChips').appendChild(s);});
}
document.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.f){fsel=e.target.dataset.f;
    document.querySelectorAll('[data-f]').forEach(c=>c.classList.toggle('on',c.dataset.f===fsel));shown=150;render();}
  if(e.target.dataset&&e.target.dataset.s){const k=e.target.dataset.s;
    if(sortK===k)sortD*=-1;else{sortK=k;sortD=-1;}render();}
});
$('q')&&$('q').addEventListener('input',()=>{shown=150;render();});
$('more').onclick=()=>{shown+=300;render();};
function fm(n){return n==null?'—':Number(n).toLocaleString();}
function render(){
  let f=DATA;
  if(fsel==='off')f=f.filter(d=>!d.on);else f=f.filter(d=>d.on);
  if(gsel)f=f.filter(d=>d.grp===gsel);
  if(fsel==='spend')f=f.filter(d=>d.cost>0);
  if(fsel==='lose')f=f.filter(d=>d.top1!=null&&d.bid<d.top1);
  const t=$('q').value.trim();
  if(t)f=f.filter(d=>d.kw.includes(t)||d.grp.includes(t));
  f=[...f].sort((a,b)=>{const x=a[sortK],y=b[sortK];
    if(x==null)return 1;if(y==null)return -1;
    return (x>y?1:x<y?-1:0)*sortD*(typeof x==='string'?-1:1);});
  const tImp=f.reduce((s,d)=>s+d.imp,0),tClk=f.reduce((s,d)=>s+d.clk,0),tCost=f.reduce((s,d)=>s+d.cost,0);
  const winning=f.filter(d=>(d.rnk&&d.rnk<=1.4)||(d.top1!=null&&d.bid>=d.top1&&!d.rnk)).length;
  $('cards').innerHTML=
    '<div class="card"><div class="l">키워드</div><div class="v">'+f.length.toLocaleString()+'</div></div>'
   +'<div class="card"><div class="l">오늘 노출</div><div class="v">'+tImp.toLocaleString()+'</div></div>'
   +'<div class="card"><div class="l">오늘 클릭</div><div class="v">'+tClk.toLocaleString()+'</div></div>'
   +'<div class="card"><div class="l">오늘 비용(VAT포함)</div><div class="v">'+tCost.toLocaleString()+'원</div></div>'
   +'<div class="card"><div class="l">1위권(실측 우선)</div><div class="v g">'+winning.toLocaleString()+'개</div></div>';
  const gAgg={};
  DATA.filter(d=>d.on).forEach(d=>{const g=gAgg[d.grp]=gAgg[d.grp]||{imp:0,clk:0,cost:0,win:0,n:0};
    g.imp+=d.imp;g.clk+=d.clk;g.cost+=d.cost;g.n++;if(d.top1!=null&&d.bid>=d.top1)g.win++;});
  $('grpcards').innerHTML=Object.entries(gAgg).sort((a,b)=>b[1].cost-a[1].cost)
    .map(([g,v])=>'<div class="card" style="min-width:104px;padding:8px 12px;cursor:pointer" onclick="gsel=\''+g+'\';buildGrpChips();render()">'
      +'<div class="l">'+g+'</div><div style="font-size:13px;font-weight:900">'+v.cost.toLocaleString()+'원</div>'
      +'<div class="l">클릭 '+v.clk+' · 1위 '+v.win+'/'+v.n+'</div></div>').join('');
  $('tb').innerHTML=f.slice(0,shown).map((d,i)=>{
    let j='<span class="m">—</span>';
    if(!d.on)j='<span class="m">꺼짐</span>';
    else if(d.rnk&&d.rnk<=1.4)j='<span class="win">1위(실측)</span>';
    else if(d.top1!=null)j=d.bid>=d.top1
      ?(d.rnk?'<span class="a">입찰OK·실측 '+Number(d.rnk).toFixed(1)+'위</span>':'<span class="win">1위권</span>')
      :'<span class="lose">밀림 '+fm(d.top1-d.bid)+'</span>';
    const mg=MANAGE?'<td onclick="event.stopPropagation()" style="white-space:nowrap">'
      +'<input value="'+d.bid+'" style="width:64px;background:#0E1730;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:3px 6px;font-size:12px" id="bi_'+i+'">'
      +'<button style="margin-left:4px;padding:3px 8px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-size:11px;font-weight:800;cursor:pointer" onclick="setBid('+i+',\''+d.id+'\',\''+d.gid+'\')">저장</button>'
      +'<button style="margin-left:4px;padding:3px 8px;border-radius:6px;border:none;background:'+(d.on?'#DC2626':'#16A34A')+';color:#fff;font-size:11px;font-weight:800;cursor:pointer" onclick="setOnOff(\''+d.id+'\',\''+d.gid+'\','+(d.on?0:1)+')">'+(d.on?'끄기':'켜기')+'</button></td>':'';
    return '<tr style="cursor:pointer" onclick="showHist(\''+d.kw.replace(/'/g,"")+'\')"><td>'+d.kw+'</td><td>'+d.grp+'</td>'
      +'<td class="'+(d.vol>=10000?'a':'')+'">'+(d.vol!=null?fm(d.vol):'—')+'</td>'
      +'<td>'+fm(d.bid)+'</td><td>'+fm(d.top1)+'</td><td>'+j
      +'</td><td>'+fm(d.imp)+'</td><td>'+fm(d.clk)+'</td><td>'+(d.cost?fm(d.cost)+'원':'—')
      +'</td><td>'+(d.rnk?Number(d.rnk).toFixed(1):'—')+'</td>'+mg+'</tr>';}).join('');
  // 문제함: 핵심그룹 순위 밀림 / 검색량 큰데 노출 0
  const CORE=new Set(['메인키워드','확장_수리누설']);
  const p1=DATA.filter(d=>d.on&&CORE.has(d.grp)&&d.rnk&&d.rnk>2.5).slice(0,5)
    .map(d=>'⚠️ <b>'+d.kw+'</b> 실측 '+Number(d.rnk).toFixed(1)+'위 — 핵심 단어가 밀리는 중');
  const p2=DATA.filter(d=>d.on&&(d.vol||0)>=5000&&d.imp===0).slice(0,5)
    .map(d=>'🕳️ <b>'+d.kw+'</b> 월 '+fm(d.vol)+'번 검색되는데 오늘 노출 0 — 소재 심사·품질 확인 필요');
  const ps=[...p1,...p2];
  $('issues').innerHTML=ps.length
    ?'<div style="background:#7f1d1d22;border:1px solid #DC2626;border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.9"><b style="color:#F87171">📋 오늘의 문제함 ('+ps.length+')</b><br>'+ps.join('<br>')+'</div>'
    :'<div style="background:#14532d22;border:1px solid #16A34A;border-radius:12px;padding:8px 14px;font-size:12.5px;color:var(--green);font-weight:800">✅ 문제함 비어 있음 — 핵심 단어 전부 정상</div>';
  $('more').style.display=f.length>shown?'block':'none';
}
let MANAGE=false,MTOK=localStorage.getItem('adconsole_mtok')||'';
function toggleManage(){
  if(!MANAGE){ if(!MTOK){MTOK=prompt('관리 비밀번호 (쓰기 권한)')||'';if(!MTOK)return;localStorage.setItem('adconsole_mtok',MTOK);} MANAGE=true; }
  else MANAGE=false;
  document.getElementById('mgCol').style.display=MANAGE?'':'none';
  document.getElementById('mgBtn').style.background=MANAGE?'#DC2626':'#334155';
  render();
}
async function setBid(i,id,gid){
  const bid=Number(document.getElementById('bi_'+i).value);
  const j=await fetch('/api/ad-manage?token='+encodeURIComponent(MTOK)+'&step=setbid&id='+id+'&gid='+gid+'&bid='+bid,{cache:'no-store'}).then(r=>r.status===404?{ok:false,error:'비밀번호 틀림'}:r.json());
  alert(j.ok?'변경됨: '+bid.toLocaleString()+'원':'실패: '+(j.error||JSON.stringify(j.err)));
  if(j.ok)load();
}
async function setOnOff(id,gid,on){
  const j=await fetch('/api/ad-manage?token='+encodeURIComponent(MTOK)+'&step=onoff&id='+id+'&gid='+gid+'&on='+on,{cache:'no-store'}).then(r=>r.status===404?{ok:false,error:'비밀번호 틀림'}:r.json());
  alert(j.ok?(on?'켜짐':'꺼짐'):'실패: '+(j.error||JSON.stringify(j.err)));
  if(j.ok)load();
}
async function showHist(kw){
  $('histPanel').style.display='block';
  $('histTitle').textContent=kw+' — 입찰가 변동 기록';
  $('histBody').textContent='불러오는 중…';$('histSvg').innerHTML='';
  const j=await fetch('/api/ad-console?token='+encodeURIComponent(TOK)+'&hist='+encodeURIComponent(kw),{cache:'no-store'}).then(x=>x.json());
  const rows=(j.rows||[]);
  if(!rows.length){$('histBody').textContent='아직 기록이 없습니다. 자동맞춤이 이 단어를 바꿀 때마다 여기 쌓입니다.';return;}
  $('histBody').textContent=rows.length+'번 조정됨 · 최근: '+new Date(rows[rows.length-1].run_at).toLocaleString('ko-KR');
  // 단일 계열 선 그래프 (입찰가 to)
  const W=408,H=180,P=34;
  const vs=rows.map(r=>r.bid_to),ts=rows.map(r=>new Date(r.run_at).getTime());
  const mn=Math.min(...vs)*0.9,mx=Math.max(...vs)*1.1||1;
  const X=t=>rows.length<2?W/2:P+(W-2*P)*(t-ts[0])/((ts[ts.length-1]-ts[0])||1);
  const Y=v=>H-P-(H-2*P)*(v-mn)/((mx-mn)||1);
  let svg='';
  // 격자 (은은하게)
  for(let i=0;i<=3;i++){const y=P+(H-2*P)*i/3;const val=Math.round(mx-(mx-mn)*i/3);
    svg+='<line x1="'+P+'" y1="'+y+'" x2="'+(W-P)+'" y2="'+y+'" stroke="#1E2A44" stroke-width="1"/>'
       +'<text x="'+(P-6)+'" y="'+(y+4)+'" fill="#7C8CA8" font-size="9" text-anchor="end">'+val.toLocaleString()+'</text>';}
  const pts=rows.map((r,i)=>X(ts[i]).toFixed(1)+','+Y(r.bid_to).toFixed(1)).join(' ');
  svg+='<polyline points="'+pts+'" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>';
  rows.forEach((r,i)=>{svg+='<circle cx="'+X(ts[i]).toFixed(1)+'" cy="'+Y(r.bid_to).toFixed(1)+'" r="4" fill="#3B82F6" stroke="#111A2E" stroke-width="2"><title>'
    +new Date(r.run_at).toLocaleTimeString('ko-KR')+' — '+r.bid_from.toLocaleString()+'→'+r.bid_to.toLocaleString()+'원 (1위가 '+(r.est1||0).toLocaleString()+')</title></circle>';});
  const last=rows[rows.length-1];
  svg+='<text x="'+(W-P)+'" y="'+(Y(last.bid_to)-10)+'" fill="#E2E8F0" font-size="11" font-weight="800" text-anchor="end">'+last.bid_to.toLocaleString()+'원</text>';
  $('histSvg').innerHTML=svg;
}
boot();
</script></body></html>
