<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s5 .photo { height: 600px; margin-top: 80px; object-position: center 40%; }
  .s5 .steps { list-style: none; margin: 72px 60px 0; text-align: left; }
  .s5 .steps li { display: grid; grid-template-columns: 110px 1fr; align-items: baseline; padding: 34px 10px; border-bottom: 1px solid var(--line); }
  .s5 .steps li:first-child { border-top: 2px solid var(--navy); }
  .s5 .steps .n { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; color: var(--point); }
  .s5 .steps b { display: block; font-size: 36px; font-weight: 800; letter-spacing: -0.045em; color: var(--navy); }
  .s5 .steps span.d { display: block; margin-top: 10px; font-size: 27px; font-weight: 500; letter-spacing: -0.035em; color: var(--sub); line-height: 1.5; }
  .s5 .real { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 72px 40px 0; }
  .s5 .real figure img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .s5 .real figcaption { margin-top: 14px; font-size: 24px; font-weight: 700; letter-spacing: -0.035em; color: var(--navy); }
  .s5 .cap { margin-top: 26px; font-size: 20px; font-weight: 600; color: var(--sub); }
</style></head>
<body>
<section class="sec s5 bg-soft">
  <h2 class="title"><span class="l">방문하면,</span><br>이 순서로 고칩니다</h2>
  <img class="full photo" src="../photos/12_tech.png" alt="">
  <ol class="steps">
    <li><span class="n">01</span><div><b>전화 · 접수</b><span class="d">증상 듣고 방문 시간 맞춤</span></div></li>
    <li><span class="n">02</span><div><b>방문 진단</b><span class="d">압력 · 바람 온도 측정</span></div></li>
    <li><span class="n">03</span><div><b>원인 설명 · 견적</b><span class="d">동의하신 금액으로만 진행</span></div></li>
    <li><span class="n">04</span><div><b>수리 · 작동 확인</b><span class="d">고친 뒤 온도 다시 재고 작업 사진 전송</span></div></li>
  </ol>
  <div class="real">
    <figure><img src="../real/gauge.jpg" alt=""><figcaption>압력 측정</figcaption></figure>
    <figure><img src="../real/temp.jpg" alt=""><figcaption>바람 온도 측정</figcaption></figure>
    <figure><img src="../real/outdoor.jpg" alt=""><figcaption>실외기 점검</figcaption></figure>
  </div>
  <p class="cap">사진: 올데이케어 실제 작업</p>
  <p class="ai">맨 위 사진은 이해를 돕기 위한 연출 이미지입니다</p>
  <div class="next"><p>카페부터 사무실까지</p><i>↓</i></div>
</section>
</body></html>
