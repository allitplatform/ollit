<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s1b { padding-top: 8px; }
  .s1b .sub { font-size: 34px; font-weight: 500; letter-spacing: -0.035em; color: var(--ink); }
  .s1b .cols { display: grid; grid-template-columns: repeat(3, 1fr); margin: 64px 40px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .s1b .cols div { padding: 34px 4px; font-size: 30px; font-weight: 700; letter-spacing: -0.045em; color: var(--navy); }
  .s1b .cols div + div { border-left: 1px solid var(--line); }
</style></head>
<body>
<section class="sec s1b">
  <p class="sub">냉난방기에서 따뜻한 바람이 안 나올 때</p>
  <div class="cols"><div>서울 · 경기 · 인천</div><div>브랜드 상관없이</div><div>원인 확인 후 견적</div></div>
  <p class="ai">이해를 돕기 위한 연출 이미지입니다</p>
  <div class="next"><p>혹시, 지금 이런 상태인가요?</p><i>↓</i></div>
</section>
</body></html>
