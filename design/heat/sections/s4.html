<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s4 { padding-top: 96px; }
  .s4 .vs { display: grid; grid-template-columns: 0.82fr 1.18fr; gap: 20px; align-items: end; margin: 0 40px; text-align: left; }
  .s4 .card { overflow: hidden; }
  .s4 .card img { display: block; width: 100%; object-fit: cover; }
  .s4 .card .t { padding: 36px 32px 40px; }
  .s4 .card .k { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .s4 .card .h { margin-top: 14px; font-size: 34px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.3; }
  .s4 .card .d { margin-top: 18px; font-size: 26px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.5; }
  .s4 .bad { background: #F3F3F2; color: var(--sub); }
  .s4 .bad img { height: 380px; filter: grayscale(0.85) brightness(1.04); opacity: 0.85; }
  .s4 .bad .k { color: var(--gray); }
  .s4 .bad .h { color: #6A6A6E; }
  .s4 .good { border: 5px solid var(--point); background: var(--white); }
  .s4 .good img { height: 500px; }
  .s4 .good .t { padding: 40px 36px 44px; }
  .s4 .good .k { color: var(--deep); font-size: 28px; font-weight: 800; }
  .s4 .good .h { color: var(--navy); font-size: 42px; }
  .s4 .good small { display: block; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--deep); }
</style></head>
<body>
<section class="sec s4">
  <div class="vs">
    <div class="card bad"><img src="../photos/05_leak.png" alt="" style="object-position:center 40%"><div class="t"><p class="k">흔한 수리</p><p class="h">가스만 넣고<br>가는 수리</p><p class="d">몇 주 뒤 또 빠지고,<br>출장비는 또</p></div></div>
    <div class="card good"><img src="../photos/09_leaktest.png" alt="" style="object-position:30% center"><div class="t"><p class="k">올데이케어</p><p class="h">새는 곳부터 찾고,<br>막은 뒤 충전</p><small>질소 압력 시험 · 누설 탐지</small></div></div>
  </div>
  <p class="ai">이해를 돕기 위한 연출 이미지입니다</p>
  <div class="next"><p>감이 아니라, 숫자로 고칩니다</p><i>↓</i></div>
</section>
</body></html>
