<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s4 { padding-bottom: 110px; }
  .s4 .pair { margin-top: 84px; }
  .s4 .pair + .pair { margin-top: 76px; }
  .s4 .imgs { display: flex; gap: 8px; }
  .s4 .imgs figure { flex: 0 0 496px; text-align: left; }
  .s4 .imgs img { display: block; width: 496px; height: 496px; object-fit: cover; }
  .s4 .wide .imgs img { height: 330px; }
  .s4 .tag { display: block; margin: 18px 0 0 24px; font-size: 24px; font-weight: 800; letter-spacing: 0.08em; line-height: 1; color: var(--sub); }
  .s4 .tag.after { color: var(--red); }
  .s4 .name { margin-top: 26px; font-size: 40px; font-weight: 800; letter-spacing: -0.04em; }
  .s4 .notice { margin: 90px 60px 0; font-size: 24px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.5; color: var(--sub); }
</style></head>
<body>
<section class="sec s4 bg-light">
  <p class="eyebrow">BEFORE &amp; AFTER</p>
  <h2 class="title"><span class="l">작업 전과</span><br><span class="red">작업 후</span></h2>

  <div class="pair">
    <div class="imgs">
      <figure><img src="../photos/ba1_before.jpg" alt=""><span class="tag">BEFORE</span></figure>
      <figure><img src="../photos/ba1_after.jpg" alt=""><span class="tag after">AFTER</span></figure>
    </div>
    <p class="name">후드 내부</p>
  </div>
  <div class="pair">
    <div class="imgs">
      <figure><img src="../photos/ba2_before.jpg" alt=""><span class="tag">BEFORE</span></figure>
      <figure><img src="../photos/ba2_after.jpg" alt=""><span class="tag after">AFTER</span></figure>
    </div>
    <p class="name">기름 필터</p>
  </div>
  <div class="pair wide">
    <div class="imgs">
      <figure><img src="../photos/ba3_before.jpg" alt=""><span class="tag">BEFORE</span></figure>
      <figure><img src="../photos/ba3_after.jpg" alt=""><span class="tag after">AFTER</span></figure>
    </div>
    <p class="name">후드 외부</p>
  </div>

  <p class="notice">이해를 돕기 위한 연출 이미지입니다 · 실제 작업 사진은 상담 시 보여드립니다</p>
</section>
</body></html>
