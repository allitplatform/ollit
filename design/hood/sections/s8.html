<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s8 .pair { display: flex; gap: 12px; margin-top: 84px; }
  .s8 .pair figure { flex: 1; }
  .s8 .pair img { display: block; width: 494px; height: 400px; object-fit: cover; }
  .s8 .pair figcaption { margin-top: 22px; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; color: var(--text-sub); }
</style></head>
<body>
<section class="sec s8 bg-white">
  <p class="eyebrow">DEEP CLEANING</p>
  <h2 class="title">더 꼼꼼하게</h2>
  <ul class="checks">
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>부품을 세척액에 담가 <b>굳은 기름을 녹이고</b></span></li>
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>날개 사이 · 모서리까지 <b>손으로 한 번 더</b></span></li>
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>다시 조립한 뒤 <b>흡입력 확인</b></span></li>
  </ul>
  <div class="pair">
    <figure><img src="../photos/h5_soak.jpg" alt=""><figcaption>세척 중</figcaption></figure>
    <figure><img src="../photos/h6_after.jpg" alt=""><figcaption>세척 후</figcaption></figure>
  </div>
</section>
</body></html>
