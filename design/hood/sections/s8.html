<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s8 { padding-bottom: 0; }
  .s8 .rows .row { padding: 36px 6px; align-items: flex-start; }
  .s8 .rows .n { flex: 0 0 84px; font-size: 32px; font-weight: 800; color: var(--red); line-height: 1.3; }
  .s8 .rows b { line-height: 1.3; }
  .s8 .full { height: 620px; object-fit: cover; margin-top: 120px; }
  .s8 .band { background: var(--char); color: var(--white); padding: 110px 60px 130px; }
  .s8 .band .title { margin-top: 0; color: var(--white); }
  .s8 .band .tel { margin-top: 50px; font-size: 112px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--grey); }
</style></head>
<body>
<section class="sec s8 bg-white">
  <div class="pad">
    <p class="eyebrow">HOW IT WORKS</p>
    <h2 class="title"><span class="l">접수부터</span><br>완료까지</h2>
    <div class="rows">
      <div class="row"><div class="n">01</div><div><b>간편 접수</b><span>종류 · 날짜 · 지역만 남겨주세요</span></div></div>
      <div class="row"><div class="n">02</div><div><b>확인 전화</b><span>금액을 문자로 먼저 보내드립니다</span></div></div>
      <div class="row"><div class="n">03</div><div><b>작업 전 사진</b><span>후드 상태부터 기록합니다</span></div></div>
      <div class="row"><div class="n">04</div><div><b>분해 · 세척</b><span>필터 · 팬 · 내부 순서대로</span></div></div>
      <div class="row"><div class="n">05</div><div><b>작동 확인 후 결제</b><span>흡입력을 확인하신 뒤 결제</span></div></div>
    </div>
  </div>
  <img class="full" src="../photos/h6_after.jpg" alt="">
  <div class="band">
    <h2 class="title"><span class="l">기름 냄새,</span><br>이번 주에 끝내세요</h2>
    <p class="tel">1866-2003</p>
  </div>
</section>
</body></html>
