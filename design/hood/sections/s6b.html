<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* 업소용 구간이 끝나고 가정용이 시작되는 챕터 표지 */
  .s6b { padding: 0; background: var(--char); }
  .s6b .full { height: 640px; object-fit: cover; object-position: center 22%; }
  .s6b .band { padding: 80px 40px; color: var(--white); }
  .s6b .title { margin-top: 26px; line-height: 1.16; color: var(--white); }
  .s6b .title .l { font-size: 72px; }
  .s6b .title .b { font-size: 88px; }
  .s6b .title .hot { color: #FF5A4F; }
  .s6b .lead { margin-top: 30px; font-size: 30px; font-weight: 400; letter-spacing: -0.03em; color: #CFCFCB; }
  .s6b .bar { width: 40px; height: 2px; background: #FF5A4F; margin: 52px auto 0; }
  .s6b .price { margin-top: 36px; font-size: 96px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: #FF5A4F; }
  .s6b .cap { margin-top: 20px; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; color: #CFCFCB; }
</style></head>
<body>
<section class="sec s6b">
  <img class="full" src="../photos/h1_hero.jpg" alt="">
  <div class="band">
    <p class="eyebrow">FOR HOMES</p>
    <h2 class="title"><span class="l">가정집 후드도</span><br><span class="b">똑같이 <span class="hot">분해</span>합니다</span></h2>
    <p class="lead">아파트 · 주택 · 오피스텔 — 업소용과 같은 팀, 같은 방식</p>
    <div class="bar"></div>
    <p class="price">100,000원~</p>
    <p class="cap">가정용 · VAT 별도</p>
  </div>
</section>
</body></html>
