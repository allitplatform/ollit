<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s5 .ic { flex: 0 0 64px; width: 64px; height: 64px; margin-right: 40px; fill: none; stroke: var(--deep-red); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .s5 .rows .row { padding: 46px 6px; }
</style></head>
<body>
<section class="sec s5 bg-light pad">
  <p class="eyebrow">OUR PROMISE</p>
  <h2 class="title">더 확실하게</h2>
  <div class="rows">
    <div class="row">
      <svg class="ic" viewBox="0 0 32 32"><path d="M4 10h5.5l2-3h9l2 3H28v15H4z"/><circle cx="16" cy="17" r="4.5"/></svg>
      <div><b>작업 전후 사진</b><span>분해한 부품 상태까지 사진으로 보내드립니다</span></div>
    </div>
    <div class="row">
      <svg class="ic" viewBox="0 0 32 32"><path d="M8 4h11l5 5v19H8z"/><path d="M19 4v5h5M12 15h8M12 19h8M12 23h5"/></svg>
      <div><b>추가금은 작업 전에만</b><span>현장에서 금액이 바뀌면 먼저 동의를 받습니다</span></div>
    </div>
    <div class="row">
      <svg class="ic" viewBox="0 0 32 32"><path d="M5 17l7 7L27 8"/></svg>
      <div><b>작동 확인 후 결제</b><span>흡입력과 소음을 직접 확인하신 뒤 결제합니다</span></div>
    </div>
  </div>
</section>
</body></html>
