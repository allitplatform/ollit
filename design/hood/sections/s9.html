<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s9 .rows .row { justify-content: space-between; align-items: baseline; padding: 44px 6px; }
  .s9 .rows .name { font-size: 32px; font-weight: 500; letter-spacing: -0.03em; }
  .s9 .rows .top .name { font-weight: 800; }
  .s9 .rows .won { font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--ink); }
  .s9 .rows .won small { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; margin-left: 4px; }
  .s9 .rows .top .won { font-size: 84px; color: var(--red); }
  .s9 .rows .top .won small { font-size: 34px; font-weight: 800; }
  .s9 .rows .won.txt { font-size: 44px; }
  .s9 .vat { margin-top: 44px; font-size: 26px; font-weight: 400; letter-spacing: -0.03em; color: var(--text-sub); }
</style></head>
<body>
<section class="sec s9 bg-grey pad">
  <p class="eyebrow">PRICE</p>
  <h2 class="title"><span class="l">가격부터</span><br>보여드립니다</h2>
  <div class="rows">
    <div class="row top"><div class="name">업소용 후드 청소</div><div class="won">159,000<small>원~</small></div></div>
    <div class="row"><div class="name">가정용 후드 청소</div><div class="won">100,000<small>원~</small></div></div>
    <div class="row"><div class="name">후드 설치 · 교체</div><div class="won txt">현장 견적</div></div>
    <div class="row"><div class="name">야간 작업</div><div class="won txt">추가금 없음</div></div>
  </div>
  <p class="vat">VAT 별도 · 후드 크기 · 개수 · 기름 상태에 따라 달라질 수 있습니다</p>
</section>
</body></html>
