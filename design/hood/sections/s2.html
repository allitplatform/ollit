<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s2 { padding-bottom: 110px; }
  .s2 .fig { width: 1000px; height: 760px; margin-top: 70px; }
  .s2 .fig img { position: absolute; left: 120px; top: 0; width: 760px; height: 760px; }
  .s2 .rows { margin-top: 30px; }
  .s2 .rows .row { padding: 30px 6px; align-items: flex-start; }
  .s2 .rows .n { flex: 0 0 74px; font-size: 30px; font-weight: 800; color: var(--red); line-height: 1.3; }
  .s2 .rows b { font-size: 34px; line-height: 1.3; }
  .s2 .wide { height: 520px; object-fit: cover; object-position: center 62%; margin-top: 90px; }
  .s2 .note { margin-top: 56px; font-size: 32px; font-weight: 400; letter-spacing: -0.03em; }
  .s2 .note b { font-weight: 800; }
</style></head>
<body>
<section class="sec s2 bg-grey">
  <p class="eyebrow">WHERE GREASE BUILDS UP</p>
  <h2 class="title"><span class="l">기름은</span><br>어디에 <span class="red">쌓일까</span></h2>

  <!-- 지시선 끝점은 h2_cutaway 부품 위치 기준. 사진 바탕은 #EEEEEC 에 맞춰 보정해 둠 -->
  <div class="fig">
    <img src="../photos/h2_cutaway.jpg" alt="">
    <svg class="lines" viewBox="0 0 1000 760">
      <polyline points="400,605 100,605"/><circle cx="400" cy="605" r="3"/>
      <polyline points="545,385 900,385"/><circle cx="545" cy="385" r="3"/>
      <polyline points="400,345 100,345"/><circle cx="400" cy="345" r="3"/>
      <polyline points="660,160 900,160"/><circle cx="660" cy="160" r="3"/>
    </svg>
    <span class="lb" style="left:52px;top:592px"><i>01</i></span>
    <span class="lb" style="left:914px;top:372px"><i>02</i></span>
    <span class="lb" style="left:52px;top:332px"><i>03</i></span>
    <span class="lb" style="left:914px;top:147px"><i>04</i></span>
  </div>

  <div class="pad">
    <div class="rows">
      <div class="row"><div class="n">01</div><div><b>기름 필터</b><span>가장 먼저 기름이 걸리는 곳</span></div></div>
      <div class="row"><div class="n">02</div><div><b>시로코팬</b><span>날개 사이에 기름이 굳어 흡입력이 떨어지는 곳</span></div></div>
      <div class="row"><div class="n">03</div><div><b>모터 하우징</b><span>기름이 튀어 소음과 냄새가 생기는 곳</span></div></div>
      <div class="row"><div class="n">04</div><div><b>배기 통로</b><span>겉에서 보이지 않는 안쪽 벽</span></div></div>
    </div>
  </div>

  <img class="full wide" src="../photos/h4_grease.jpg" alt="">
  <p class="note">필터만 빼서 닦으면, <b>02 · 03 · 04</b> 는 그대로 남습니다.</p>
</section>
</body></html>
