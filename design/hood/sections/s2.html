<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s2 .full { height: 820px; object-fit: cover; object-position: center 10%; margin-top: 84px; }
  .s2 .cap { margin-top: 24px; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; color: var(--text-sub); }
  .s2 .rows { margin-top: 64px; }
  .s2 .rows .row { padding: 44px 6px; }
  .s2 .ic { flex: 0 0 64px; width: 64px; height: 64px; margin-right: 40px; fill: none; stroke: var(--deep-red); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
<section class="sec s2 bg-grey">
  <p class="eyebrow">WHY IT MATTERS</p>
  <h2 class="title"><span class="l">보이지 않는 곳에</span><br>기름이 쌓이고 있습니다</h2>

  <img class="full" src="../photos/ba1_before.jpg" alt="">
  <p class="cap">후드 안쪽 실제 모습 예시</p>

  <div class="pad">
    <div class="rows">
      <div class="row">
        <svg class="ic" viewBox="0 0 32 32"><path d="M16 3c1 5 7 8 7 15a7 7 0 0 1-14 0c0-3 1.5-5 3-6.5 0 2 1 3.5 2.5 3.5C14 11 14 7 16 3z"/></svg>
        <div><b>화재 위험</b><span>쌓인 기름은 불꽃 한 번에 번집니다</span></div>
      </div>
      <div class="row">
        <svg class="ic" viewBox="0 0 32 32"><path d="M4 11h15a4 4 0 1 0-4-4M4 17h21a4 4 0 1 1-4 4M4 23h10"/></svg>
        <div><b>냄새 · 연기 역류</b><span>흡입이 약해져 홀까지 냄새가 퍼집니다</span></div>
      </div>
      <div class="row">
        <svg class="ic" viewBox="0 0 32 32"><path d="M16 4c4 6 8 10 8 15a8 8 0 0 1-16 0c0-5 4-9 8-15z"/></svg>
        <div><b>기름 떨어짐</b><span>굳은 기름이 녹아 조리대로 떨어집니다</span></div>
      </div>
    </div>
  </div>
</section>
</body></html>
