<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s3 { padding-bottom: 110px; }
  .s3 .step { margin-top: 84px; }
  .s3 .step .full { height: 600px; object-fit: cover; }
  .s3 .txt { text-align: left; padding: 44px 80px 0; display: flex; align-items: flex-start; }
  .s3 .txt .n { flex: 0 0 84px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; color: var(--red); }
  .s3 .txt b { display: block; font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.25; }
  .s3 .txt span { display: block; margin-top: 12px; font-size: 30px; font-weight: 400; letter-spacing: -0.035em; line-height: 1.45; color: var(--text-sub); }
  .s3 .hr { margin: 84px 80px 0; }
  .s3 .last .txt { padding-top: 56px; }
</style></head>
<body>
<section class="sec s3 bg-white">
  <p class="eyebrow">OUR PROCESS</p>
  <h2 class="title"><span class="l">전문팀은</span><br>이렇게 합니다</h2>

  <div class="step">
    <img class="full" src="../photos/b2_cover.jpg" alt="">
    <div class="txt"><div class="n">01</div><div><b>주방 장비 보양</b><span>가스레인지 · 조리대 · 냉장고를 비닐로 전부 덮고 시작합니다</span></div></div>
  </div>
  <div class="step">
    <img class="full" src="../photos/b3_soak.jpg" alt="">
    <div class="txt"><div class="n">02</div><div><b>필터 분리 · 약품 불림</b><span>기름 필터를 떼어 세척액에 담가 굳은 기름을 녹입니다</span></div></div>
  </div>
  <div class="step">
    <img class="full" src="../photos/b4_scrape.jpg" alt="">
    <div class="txt"><div class="n">03</div><div><b>후드 내부 기름 제거</b><span>안쪽 벽과 이음새까지 긁어내고 닦아냅니다</span></div></div>
  </div>
  <div class="step">
    <img class="full" src="../photos/b5_floor.jpg" alt="">
    <div class="txt"><div class="n">04</div><div><b>바닥 · 주변 마감</b><span>떨어진 기름과 물기까지 정리하고 나옵니다</span></div></div>
  </div>
  <div class="hr"></div>
  <div class="last">
    <div class="txt"><div class="n">05</div><div><b>사진 보고</b><span>작업 전후 사진을 사장님께 보내드립니다</span></div></div>
  </div>
</section>
</body></html>
