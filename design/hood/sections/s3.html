<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* S2 와 같은 바탕색으로 이어짐 */
  .s3 { padding-top: 60px; padding-bottom: 120px; }
  .s3 .fig { width: 1000px; height: 880px; margin-top: 80px; }
  .s3 .fig img { position: absolute; left: 70px; top: 0; width: 660px; height: 880px; object-fit: cover; }
</style></head>
<body>
<section class="sec s3 bg-grey">
  <p class="eyebrow">FULL DISASSEMBLY</p>
  <h2 class="title">더 깊게</h2>
  <ul class="checks">
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>커버 · 필터 <b>전부 분리</b></span></li>
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>시로코팬 · 모터 주변 <b>분해 세척</b></span></li>
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>안쪽 케이싱까지 <b>기름 제거</b></span></li>
  </ul>

  <!-- 지시선 높이는 h3_exploded 부품 위치 기준. 사진 바탕은 #EEEEEC 에 맞춰 보정해 둠 -->
  <div class="fig">
    <img src="../photos/h3_exploded.jpg" alt="">
    <svg class="lines" viewBox="0 0 1000 880">
      <polyline points="556,194 770,194"/><circle cx="556" cy="194" r="3"/>
      <polyline points="538,283 770,283"/><circle cx="538" cy="283" r="3"/>
      <polyline points="481,460 770,460"/><circle cx="481" cy="460" r="3"/>
      <polyline points="450,605 770,605"/><circle cx="450" cy="605" r="3"/>
      <polyline points="556,773 770,773"/><circle cx="556" cy="773" r="3"/>
    </svg>
    <span class="lb" style="left:786px;top:181px">커버</span>
    <span class="lb" style="left:786px;top:270px">필터</span>
    <span class="lb" style="left:786px;top:447px">시로코팬</span>
    <span class="lb" style="left:786px;top:592px">모터</span>
    <span class="lb" style="left:786px;top:760px">내부 케이싱</span>
  </div>
</section>
</body></html>
