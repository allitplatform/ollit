<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s13 { padding-bottom: 0; }
  .s13 .rows .row { padding: 36px 6px; align-items: flex-start; }
  .s13 .rows .n { flex: 0 0 84px; font-size: 32px; font-weight: 800; color: var(--red); line-height: 1.3; }
  .s13 .rows b { line-height: 1.3; }
  .s13 .full { height: 620px; object-fit: cover; margin-top: 120px; }
  .s13 .band { background: var(--char); color: var(--white); padding: 110px 30px 130px; }
  .s13 .band .title { margin-top: 0; color: var(--white); font-size: 72px; }
  .s13 .band .tel { margin-top: 50px; font-size: 112px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #FF5A4F; }
</style></head>
<body>
<section class="sec s13 bg-white">
  <div class="pad">
    <p class="eyebrow">HOW IT WORKS</p>
    <h2 class="title"><span class="l">접수부터</span><br>완료까지</h2>
    <div class="rows">
      <div class="row"><div class="n">01</div><div><b>간편 접수</b><span>업종 · 후드 개수 · 지역만</span></div></div>
      <div class="row"><div class="n">02</div><div><b>확인 전화 · 견적</b><span>금액을 문자로 먼저</span></div></div>
      <div class="row"><div class="n">03</div><div><b>마감 후 방문</b><span>영업시간을 피해서</span></div></div>
      <div class="row"><div class="n">04</div><div><b>보양 · 분해 · 세척</b><span>장비 덮고 안쪽까지</span></div></div>
      <div class="row"><div class="n">05</div><div><b>사진 보고 · 결제</b><span>전후 사진 확인 후</span></div></div>
    </div>
  </div>
  <img class="full" src="../photos/ba3_after.jpg" alt="">
  <div class="band">
    <h2 class="title"><span class="l">기름 냄새,</span><br>이번 주 마감 후에 끝내세요</h2>
    <p class="tel">1866-2003</p>
  </div>
</section>
</body></html>
