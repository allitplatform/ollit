<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* 업종 6개 — 글자만, 칸 사이 1px 선 */
  .s6 .grid { display: grid; grid-template-columns: repeat(3, 1fr); margin: 84px 80px 0; border-top: 1px solid var(--sub); border-bottom: 1px solid var(--sub); }
  .s6 .grid div { padding: 58px 0; font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .s6 .grid div:nth-child(3n+2), .s6 .grid div:nth-child(3n+3) { border-left: 1px solid var(--sub); }
  .s6 .grid div:nth-child(n+4) { border-top: 1px solid var(--sub); }
  .s6 .foot { margin: 64px 90px 0; font-size: 30px; font-weight: 400; letter-spacing: -0.035em; line-height: 1.5; color: var(--text-sub); text-wrap: balance; }
  .s6 { padding-bottom: 70px; }
</style></head>
<body>
<section class="sec s6 bg-grey">
  <p class="eyebrow">WHO CALLS US</p>
  <h2 class="title"><span class="l">이런 주방에서</span><br>저희를 부릅니다</h2>
  <div class="grid">
    <div>식당</div><div>카페</div><div>급식소</div>
    <div>학교</div><div>병원</div><div>리조트</div>
  </div>
  <p class="foot">작은 카페 후드부터 대형 급식소 후드까지, 크기와 개수를 보고 견적을 먼저 드립니다</p>
</section>
</body></html>
