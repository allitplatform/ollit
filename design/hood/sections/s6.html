<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s6 { padding-bottom: 110px; }
  .s6 .full { height: 600px; object-fit: cover; }
  .s6 .first { margin-top: 84px; }
  .s6 .blk { text-align: left; padding: 64px 80px 76px; }
  .s6 .blk h3 { font-size: 44px; font-weight: 800; letter-spacing: -0.04em; }
  .s6 .blk .checks { display: block; margin-top: 30px; }
  .s6 .blk.last { padding-bottom: 0; }
  .s6 .hr { margin: 0 80px 76px; }
</style></head>
<body>
<section class="sec s6 bg-white">
  <p class="eyebrow">COMMERCIAL &amp; INSTALLATION</p>
  <h2 class="title"><span class="l">식당 후드도,</span><br>설치도</h2>

  <img class="full first" src="../photos/h7_biz.jpg" alt="">
  <div class="blk">
    <h3>업소용 후드 청소</h3>
    <ul class="checks">
      <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>대형 후드 본체 · 기름 필터 · 기름 받이</span></li>
      <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>외부 스테인리스 광택까지</span></li>
    </ul>
  </div>
  <div class="hr"></div>
  <img class="full" src="../photos/h8_install.jpg" alt="">
  <div class="blk last">
    <h3>후드 설치 · 교체</h3>
    <ul class="checks">
      <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>노후 후드 철거 후 새 후드 설치</span></li>
      <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>현장 확인 후 견적을 먼저 드립니다</span></li>
    </ul>
  </div>
</section>
</body></html>
