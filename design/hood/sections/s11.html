<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s11 .lead { margin-top: 36px; font-size: 30px; font-weight: 400; letter-spacing: -0.03em; color: var(--text-sub); }
  .s11 .blk { margin-top: 84px; }
  .s11 .blk .full { height: 560px; object-fit: cover; }
  .s11 .txt { text-align: left; padding: 48px 80px 0; display: flex; align-items: flex-start; }
  .s11 .txt .n { flex: 0 0 84px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; color: var(--red); }
  .s11 .txt b { font-weight: 800; }
  .s11 .txt > div > b { display: block; font-size: 40px; letter-spacing: -0.04em; line-height: 1.25; }
  .s11 .txt .checks { display: block; margin-top: 26px; }
  .s11 .txt .checks li { font-size: 30px; }
  .s11 .txt .checks li + li { margin-top: 14px; }
  .s11 .hr { margin: 84px 80px 0; }
  .s11 .foot { margin-top: 64px; font-size: 30px; font-weight: 400; letter-spacing: -0.03em; color: var(--text-sub); }
</style></head>
<body>
<section class="sec s11 bg-white">
  <p class="eyebrow">MORE SERVICES</p>
  <h2 class="title"><span class="l">후드만이 아닙니다,</span><br>매장 관리도 <span class="red">함께</span></h2>
  <p class="lead">후드 작업 때 같이 맡기시면 한 번 방문으로 끝납니다</p>

  <div class="blk">
    <img class="full" src="../photos/c1_restaurant.jpg" alt="">
    <div class="txt"><div class="n">01</div><div>
      <b>식당 청소 · 후드</b>
      <ul class="checks">
        <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>주방 · 홀 <b>바닥 기름때 제거</b></span></li>
        <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>후드와 <b>한 번에 같은 날</b></span></li>
      </ul>
    </div></div>
  </div>
  <div class="hr"></div>
  <div class="blk">
    <img class="full" src="../photos/c2_store.jpg" alt="">
    <div class="txt"><div class="n">02</div><div>
      <b>상가 · 매장 정기관리</b>
      <ul class="checks">
        <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>주 1회 · 월 2회 등 <b>원하는 주기로</b></span></li>
        <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>영업 전 · 마감 후 <b>시간 맞춰 방문</b></span></li>
      </ul>
    </div></div>
  </div>
  <div class="hr"></div>
  <div class="blk">
    <img class="full" src="../photos/c3_office.jpg" alt="">
    <div class="txt"><div class="n">03</div><div>
      <b>사무실 · 바닥 케어</b>
      <ul class="checks">
        <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>바닥 <b>세척 · 광택</b></span></li>
        <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span>퇴근 후 · 주말 <b>작업 가능</b></span></li>
      </ul>
    </div></div>
  </div>
  <div class="hr"></div>
  <p class="foot">현장 크기와 주기를 보고 견적을 먼저 드립니다</p>
</section>
</body></html>
