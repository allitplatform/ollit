<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* 휴대폰 첫 화면에 제목 + 사진 + 띠 큰 글자가 모두 보이도록 전체 높이 1650px 이하 */
  .s1 { padding: 0; background: var(--white); }
  .s1 .head { padding: 60px 30px; }
  .s1 .title { margin-top: 24px; line-height: 1.18; }
  .s1 .title .l { font-size: 64px; }
  .s1 .title .b { font-size: 72px; letter-spacing: -0.05em; white-space: nowrap; }
  .s1 .lead { margin-top: 26px; font-size: 30px; font-weight: 400; letter-spacing: -0.03em; color: var(--text-sub); }
  .s1 .hero { height: 860px; object-fit: cover; object-position: center 12%; }

  .s1 .band { background: var(--char); padding: 54px 30px 56px; }
  .s1 .cols { display: grid; grid-template-columns: 1.1fr 1.1fr 0.9fr; }
  .s1 .cols > div + div { border-left: 1px solid #555; }
  .s1 .cols .num { font-size: 64px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: #FF5A4F; white-space: nowrap; }
  .s1 .cols .cap { margin-top: 18px; font-size: 26px; font-weight: 500; letter-spacing: -0.05em; color: #CFCFCB; white-space: nowrap; }
</style></head>
<body>
<section class="sec s1">
  <div class="head">
    <p class="eyebrow">COMMERCIAL KITCHEN HOOD CLEANING</p>
    <h1 class="title"><span class="l">식당 후드,</span><br><span class="b"><span class="red">영업 끝나고</span> 저희가 들어갑니다</span></h1>
    <p class="lead">업소용 주방후드 분해 세척 전문팀</p>
  </div>

  <img class="full hero" src="../photos/b1_hero.jpg" alt="">

  <div class="band">
    <div class="cols">
      <div><p class="num">야간</p><p class="cap">마감 후 작업 · 추가금 없음</p></div>
      <div><p class="num">보양</p><p class="cap">주방 장비 비닐로 전부 덮고</p></div>
      <div><p class="num">보고</p><p class="cap">작업 전후 사진으로</p></div>
    </div>
  </div>
</section>
</body></html>
