<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s4 { background: var(--white); padding: 90px 0 0; }
  .s4 .title { margin-top: 36px; }
  .s4 .desc { margin-top: 30px; }
  .s4 .list { margin-top: 70px; }
</style></head>
<body>
<section class="sec s4">
  <div class="pad">
    <span class="badge">구역별 청소 범위</span>
    <h2 class="title">체크리스트로 <span class="hl">빠짐없이</span><br>한 칸씩 지웁니다</h2>
    <p class="desc">팀장이 구역마다 체크리스트로 확인합니다.</p>
  </div>
  <div class="list">
    <div class="zone">
      <img src="../photos/p3_living.jpg" alt="">
      <div class="body">
        <div class="head"><span class="num">01</span><h3>거실 · 방</h3></div>
        <div class="chips"><span class="chip">바닥 스크래퍼 + 물걸레</span><span class="chip">걸레받이 · 몰딩</span><span class="chip">스위치 · 콘센트</span><span class="chip">수납장 안쪽</span><span class="chip">방문 · 문틀</span><span class="chip">조명 커버</span></div>
      </div>
    </div>
    <div class="zone">
      <img src="../photos/p4_kitchen.jpg" alt="">
      <div class="body">
        <div class="head"><span class="num">02</span><h3>주방</h3></div>
        <div class="chips"><span class="chip">상 · 하부장 안쪽</span><span class="chip">싱크볼 · 수전</span><span class="chip">상판 실리콘 자국</span><span class="chip">후드 필터 겉면</span><span class="chip">빌트인 가전 필름</span><span class="chip">타일 벽면</span></div>
      </div>
    </div>
  </div>
</section>
</body></html>
