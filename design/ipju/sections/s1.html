<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s1 { height: 1640px; background: var(--ink); color: var(--white); }
  .s1 .bg { position: absolute; inset: 0 0 auto 0; width: 100%; height: 1500px; object-fit: cover; object-position: center 40%; }
  .s1 .shade {
    position: absolute; inset: 0 0 auto 0; height: 1500px;
    background: linear-gradient(180deg, rgba(16,16,19,0.30) 0%, rgba(16,16,19,0.05) 22%, rgba(16,16,19,0) 38%, rgba(16,16,19,0.55) 50%, rgba(16,16,19,0.92) 66%, #101013 80%);
  }
  .s1 .inner { position: absolute; left: 0; right: 0; top: 780px; z-index: 2; }
  .s1 .pill {
    display: inline-block; padding: 14px 32px; border-radius: 999px;
    background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.55);
    font-size: 30px; font-weight: 700; letter-spacing: -0.02em;
  }
  .s1 .title { margin-top: 40px; font-size: 88px; line-height: 1.18; color: var(--white); }
  .s1 .title .accent { color: var(--soft-blue); }
  .s1 .round {
    position: absolute; top: 90px; right: 70px; z-index: 3;
    width: 240px; height: 240px; border-radius: 50%;
    background: var(--white); color: var(--blue);
    border: 3px solid var(--blue);
    box-shadow: 6px 6px 0 var(--blue);
    transform: rotate(8deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .s1 .round small { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .s1 .round b { font-size: 50px; font-weight: 900; letter-spacing: -0.05em; margin-top: 4px; }
  .s1 .band {
    position: absolute; left: 60px; right: 60px; top: 1270px; z-index: 3;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--blue); border-radius: 28px;
    border: 3px solid var(--blue);
  }
  .s1 .band div { padding: 34px 10px 36px; }
  .s1 .band div + div { border-left: 2px solid rgba(255,255,255,0.28); }
  .s1 .band b { display: block; font-size: 38px; font-weight: 900; letter-spacing: -0.04em; }
  .s1 .band span { display: block; margin-top: 10px; font-size: 26px; font-weight: 600; color: var(--soft-blue-2); letter-spacing: -0.03em; }
  .s1 .fade.bottom { height: 150px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 100%); }
</style></head>
<body>
<section class="sec s1">
  <img class="bg" src="../photos/p1_hero.jpg" alt="">
  <div class="shade"></div>
  <div class="round"><small>평당</small><b>10,000원</b></div>
  <div class="inner">
    <span class="pill">신축 · 구축 아파트 / 빌라 / 오피스텔</span>
    <h1 class="title">새집의 첫 먼지,<br><span class="accent">저희가 먼저</span><br>들어가서 치웁니다</h1>
  </div>
  <div class="band">
    <div><b>평당 1만원</b><span>평수 × 10,000원</span></div>
    <div><b>전국 출동</b><span>원하는 날짜 예약</span></div>
    <div><b>사진 보고</b><span>작업 전후 전송</span></div>
  </div>
  <div class="fade bottom"></div>
</section>
</body></html>
