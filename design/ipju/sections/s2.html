<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s2 { background: var(--white); padding: 110px 0 150px; }
  .s2 .title { margin-top: 36px; }
  .s2 .desc { margin-top: 34px; }
  .s2 .photo-wrap { position: relative; margin: 64px auto 0; width: 840px; }
  .s2 .photo { display: block; width: 840px; height: 620px; object-fit: cover; border-radius: 48px; }
  .s2 .photo-wrap .sticker { position: absolute; left: 50%; bottom: -44px; transform: translateX(-50%) rotate(-3deg); white-space: nowrap; }
  .s2 .grid { margin: 110px auto 0; width: 840px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .s2 .card {
    background: var(--pale); border-radius: 32px; padding: 44px 34px 46px; text-align: left;
    border: 2px solid rgba(27, 79, 191, 0.14);
  }
  .s2 .card h4 { margin-top: 22px; font-size: 38px; font-weight: 900; letter-spacing: -0.04em; }
  .s2 .card p { margin-top: 14px; font-size: 30px; font-weight: 500; line-height: 1.5; letter-spacing: -0.03em; color: rgba(16,16,19,0.72); }
</style></head>
<body>
<section class="sec s2">
  <div class="pad">
    <span class="badge">알고 계셨나요?</span>
    <h2 class="title">새 아파트가<br><span class="hl">제일 먼지가 많은 집</span>입니다</h2>
    <p class="desc">입주 직전까지 공사 현장이었습니다.<br>바닥보다 레일 · 틈새 · 배수구가 더 문제입니다.</p>
  </div>
  <div class="photo-wrap">
    <img class="photo" src="../photos/p2_dust.jpg" alt="">
    <span class="sticker">가구 들어오기 전이 유일한 기회</span>
  </div>
  <div class="grid">
    <div class="card">
      <svg class="ico" viewBox="0 0 64 64"><path d="M10 50h44"/><path d="M16 50c2-10 8-16 16-16s14 6 16 16"/><circle cx="22" cy="20" r="2.5"/><circle cx="34" cy="14" r="2.5"/><circle cx="44" cy="22" r="2.5"/><circle cx="28" cy="26" r="1.5"/></svg>
      <h4>시멘트 · 석고 가루</h4>
      <p>창틀 레일, 수납장 안쪽에 쌓입니다</p>
    </div>
    <div class="card">
      <svg class="ico" viewBox="0 0 64 64"><rect x="14" y="22" width="26" height="34" rx="4"/><path d="M20 22v-6h14v6"/><path d="M27 16V8l16-4"/><path d="M48 30c3 4 4 7 4 9a4 4 0 0 1-8 0c0-2 1-5 4-9z"/></svg>
      <h4>실리콘 · 접착제</h4>
      <p>유리, 타일, 상판에 굳어 있습니다</p>
    </div>
    <div class="card">
      <svg class="ico" viewBox="0 0 64 64"><rect x="8" y="8" width="40" height="16" rx="3"/><path d="M48 16h6v14H30v8"/><rect x="25" y="38" width="10" height="20" rx="2"/></svg>
      <h4>페인트 · 스티커 자국</h4>
      <p>문틀, 스위치 주변에 남습니다</p>
    </div>
    <div class="card">
      <svg class="ico" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="6"/><path d="M32 10v16M32 38v16M10 32h16M38 32h16"/></svg>
      <h4>배수구 공사 잔여물</h4>
      <p>욕실 · 베란다 배수구에 남습니다</p>
    </div>
  </div>
</section>
</body></html>
