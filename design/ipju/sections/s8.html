<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s8 { background: var(--white); padding: 120px 0 90px; }
  .s8 .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.12; }
  .s8 .fade.top { background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0) 100%); height: 220px; }
  .s8 .inner { position: relative; z-index: 6; }
  .s8 .desc { margin-top: 32px; }
  .s8 .tel { margin-top: 64px; font-size: 128px; font-weight: 900; color: var(--blue); letter-spacing: -0.04em; line-height: 1; }
  .s8 .cta {
    display: inline-block; margin-top: 60px; padding: 38px 90px; border-radius: 999px;
    background: var(--blue); color: var(--white); font-size: 44px; font-weight: 900; letter-spacing: -0.03em;
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  }
  .s8 .foot { margin-top: 120px; font-size: 26px; font-weight: 600; color: rgba(16,16,19,0.55); letter-spacing: -0.02em; }
</style></head>
<body>
<section class="sec s8">
  <img class="bg" src="../photos/p1_hero.jpg" alt="">
  <div class="fade top"></div>
  <div class="inner pad">
    <h2 class="title">입주 날짜가 정해졌다면<br><span class="hl">지금 자리부터 잡으세요</span></h2>
    <p class="desc">주말 · 손 없는 날은 일정이 빨리 찹니다</p>
    <div class="tel">1866-2003</div>
    <span class="cta">무료 견적 접수하기</span>
    <p class="foot">올데이케어 입주청소 · 전국 출동</p>
  </div>
</section>
</body></html>
