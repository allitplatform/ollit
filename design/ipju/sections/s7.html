<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s7 { background: var(--blue); color: var(--white); padding: 230px 0 250px; }
  .s7 .fade.top { background: linear-gradient(180deg, #F3F6FC 0%, rgba(27,79,191,0) 100%); height: 170px; }
  .s7 .fade.bottom { background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 100%); height: 170px; }
  .s7 .title { margin-top: 36px; color: var(--white); }
  .s7 .title .accent { color: var(--soft-blue-2); }
  .s7 .cards { margin: 80px auto 0; width: 840px; display: flex; flex-direction: column; gap: 30px; }
  .s7 .card {
    display: flex; gap: 32px; align-items: center; text-align: left;
    background: var(--white); color: var(--ink); border-radius: 32px; padding: 42px 44px;
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  }
  .s7 .ic { flex: none; width: 110px; height: 110px; border-radius: 28px; background: var(--pale); display: flex; align-items: center; justify-content: center; }
  .s7 .card h4 { font-size: 42px; font-weight: 900; letter-spacing: -0.04em; }
  .s7 .card p { margin-top: 10px; font-size: 30px; font-weight: 500; line-height: 1.5; letter-spacing: -0.03em; color: rgba(16,16,19,0.72); }
</style></head>
<body>
<section class="sec s7">
  <div class="fade top"></div>
  <div class="pad">
    <span class="badge onblue">올데이케어의 약속</span>
    <h2 class="title">가격이 낮아도<br><span class="accent">기준은 낮추지 않습니다</span></h2>
  </div>
  <div class="cards">
    <div class="card">
      <span class="ic"><svg class="ico" viewBox="0 0 64 64"><path d="M16 6h22l12 12v40H16z"/><path d="M38 6v12h12"/><path d="M24 32h18M24 40h18M24 48h12"/></svg></span>
      <div><h4>추가금은 작업 전에만</h4><p>옵션은 먼저 안내하고, 동의하셔야 진행합니다</p></div>
    </div>
    <div class="card">
      <span class="ic"><svg class="ico" viewBox="0 0 64 64"><path d="M6 22a4 4 0 0 1 4-4h10l4-6h16l4 6h10a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z"/><circle cx="32" cy="35" r="10"/></svg></span>
      <div><h4>전후 사진으로 보고</h4><p>현장에 못 오셔도 사진으로 확인하실 수 있습니다</p></div>
    </div>
    <div class="card">
      <span class="ic"><svg class="ico" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="M21 33l8 8 15-17"/></svg></span>
      <div><h4>검수 확인 후 결제</h4><p>부족한 곳은 그 자리에서 다시 청소합니다</p></div>
    </div>
  </div>
  <div class="fade bottom"></div>
</section>
</body></html>
