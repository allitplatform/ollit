<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s1a { padding-top: 0; padding-bottom: 72px; }
  .s1a .photo { height: 900px; object-position: center 22%; }
  .s1a .head { padding: 76px 30px 0; }
  .s1a .title { font-size: 76px; line-height: 1.22; }
  .s1a .title .l { font-weight: 300; }
  .s1a .basis { margin-top: 40px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; color: var(--sub); }
  .s1a .cols { display: grid; grid-template-columns: repeat(3, 1fr); margin: 64px 40px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .s1a .cols div { padding: 34px 4px; font-size: 30px; font-weight: 700; letter-spacing: -0.045em; color: var(--ink-deep); }
  .s1a .cols div + div { border-left: 1px solid var(--line); }
</style></head>
<body>
<section class="sec s1a">
  <img class="full photo" src="../photos/h1_bright.png" alt="">
  <div class="head">
    <p class="eyebrow">ALLDAYCARE TECHNICIAN PROGRAM</p>
    <h1 class="title"><span class="l">에어컨 기사,</span><br><span class="uline">고수익</span> 월 1,000만원 이상<br><span class="l">일주일이면 시작합니다</span></h1>
  </div>
</section>
</body></html>
