<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s3 .nums { display: grid; grid-template-columns: 1fr 1fr; margin: 84px 40px 0; }
  .s3 .nums > div { padding: 6px 10px; }
  .s3 .nums > div + div { border-left: 1px solid var(--line); }
  .s3 .nums b { display: block; font-size: 120px; font-weight: 800; letter-spacing: -0.055em; line-height: 1; color: var(--ink-deep); white-space: nowrap; }
  .s3 .nums b small { font-size: 48px; letter-spacing: -0.03em; margin-left: 2px; }
  .s3 .nums p { margin-top: 24px; font-size: 32px; font-weight: 700; letter-spacing: -0.035em; color: var(--sub); }
  .s3 .band { margin-top: 84px; }
  .s3 .note { margin: 32px 60px 0; font-size: 20px; line-height: 1.65; letter-spacing: -0.01em; color: var(--sub); }
</style></head>
<body>
<section class="sec s3">

  <p class="eyebrow">PROOF</p>
  <h2 class="title"><span class="l">올여름,</span><br>일은 이만큼 있었습니다</h2>
  <div class="nums">
    <div><b>3,508<small>건</small></b><p>올여름 올데이케어 접수</p></div>
    <div><b>34<small>만원</small></b><p>직영기사 성수기 일 평균</p></div>
  </div>
  <div class="band">일은 넘치고, 기사는 모자랍니다</div>
  <p class="note">접수: 2026년 6~8월 올데이케어 작업 접수. 일 평균: 직영기사 6~8월 정산(기사 지급액, 올잇 정산, 작업한 날 기준)이며 수입을 보장하지 않습니다.</p>
  <div class="next"><p>혹시 이런 생각, 해보셨나요?</p><i>↓</i></div>
</section>
</body></html>
