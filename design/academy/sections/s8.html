<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s8 .photo { height: 700px; margin-top: 76px; object-position: center 55%; }
  .s8 .weeks { margin: 76px 40px 0; text-align: left; border-top: 1px solid var(--line); }
  .s8 .wk { display: flex; padding: 44px 0; border-bottom: 1px solid var(--line); }
  .s8 .wk .n { flex: 0 0 96px; padding-right: 20px; margin-right: 24px; border-right: 1px solid var(--line); font-size: 40px; font-weight: 800; letter-spacing: -0.04em; color: var(--yellow-d); }
  .s8 .wk .b { flex: 1; }
  .s8 .wk b { display: block; font-size: 38px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink-deep); }
  .s8 .wk p { margin-top: 12px; font-size: 30px; line-height: 1.55; letter-spacing: -0.035em; color: var(--sub); }
  .s8 .wk .ph { display: flex; gap: 8px; margin-top: 26px; }
  .s8 .wk .ph img { display: block; height: 300px; object-fit: cover; }
  .s8 .big { margin-top: 84px; font-size: 64px; line-height: 1.3; letter-spacing: -0.045em; font-weight: 800; color: var(--ink-deep); }
  .s8 .big .l { font-weight: 300; }
  .s8 .small { margin-top: 40px; font-size: 28px; letter-spacing: -0.03em; color: var(--sub); }
</style></head>
<body>
<section class="sec s8">
  <p class="eyebrow">3 WEEKS</p>
  <h2 class="title"><span class="l">3주,</span><br>현장에서 바로 쓰는 것만</h2>
  <img class="full photo" src="../photos/r12.jpg" alt="">
  <div class="weeks">
    <div class="wk"><div class="n">1주</div><div class="b"><b>벽걸이</b><p>구조 · 공구 · 안전<br>분해 → 세척 → 조립 반복<br>단독 테스트</p><div class="ph"><img src="../photos/r01.jpg" alt="" style="width:402px"><img src="../photos/r23.jpg" alt="" style="width:402px"></div></div></div>
    <div class="wk"><div class="n">2주</div><div class="b"><b>스탠드 · 천장형</b><p>3종 세척<br>냉매 기초(게이지 · 압력 점검)</p><div class="ph"><img src="../photos/r16.jpg" alt="" style="width:265px"><img src="../photos/r20.jpg" alt="" style="width:265px"><img src="../photos/r22.jpg" alt="" style="width:265px"></div></div></div>
    <div class="wk"><div class="n">3주</div><div class="b"><b>실전</b><p>로봇청소기<br>고객응대 · 분쟁 예방<br>앱 사용법 · 실제 현장 동행</p><div class="ph"><img src="../photos/r24.jpg" alt="" style="width:402px"><img src="../photos/r15.jpg" alt="" style="width:402px"></div></div></div>
  </div>
  <p class="big"><span class="l">수료 평가 통과 →</span><br><span class="uline">바로 콜 배정 시작</span></p>
  <p class="small">현장 동행 작업은 건당 수당을 드립니다</p>
</section>
</body></html>
