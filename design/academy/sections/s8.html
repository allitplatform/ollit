<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s8 .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 84px 40px 0; text-align: left; }
  .s8 .cards > div { padding: 52px 40px 56px; min-height: 300px; }
  .s8 .cards .s { font-size: 64px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  .s8 .cards .s small { display: block; margin-top: 16px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .s8 .cards .d { margin-top: 44px; font-size: 36px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.3; }
  .s8 .c-sum { background: #F2B705; color: #1F2328; }
  .s8 .c-aut { background: #FFF7DB; color: #1F2328; }
  .s8 .c-win { background: #FFFFFF; color: #1F2328; border: 1px solid #E4E4E1; }
  .s8 .c-spr { background: #1F2328; color: #F2B705; }
  .s8 .foot { margin: 72px 80px 0; font-size: 32px; line-height: 1.55; letter-spacing: -0.035em; color: var(--ink-deep); }
  .s8 .foot b { font-weight: 800; }
</style></head>
<body>
<section class="sec s8">

  <p class="eyebrow">ALL YEAR ROUND</p>
  <h2 class="title"><span class="l">여름에만 버는 일이</span><br>아닙니다</h2>
  <div class="cards">
    <div class="c-sum"><p class="s">여름<small>6~8월</small></p><p class="d">에어컨 세척 성수기</p></div>
    <div class="c-aut"><p class="s">가을<small>9~11월</small></p><p class="d">점검 · 냉매 · 수리</p></div>
    <div class="c-win"><p class="s">겨울<small>12~2월</small></p><p class="d">로봇청소기 · 난방 수리</p></div>
    <div class="c-spr"><p class="s">봄<small>3~5월</small></p><p class="d">세척 예약 시작</p></div>
  </div>
  <p class="foot">여름 하나만 보고 시작하지 마세요.<br><b>1년 내내 일하는 구조입니다.</b></p>
  <div class="next"><p>시작은 3주면 충분합니다</p><i>↓</i></div>
</section>
</body></html>
