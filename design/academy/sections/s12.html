<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s12 .body { margin: 84px 90px 0; text-align: left; }
  .s12 .body p { font-size: 34px; line-height: 1.65; letter-spacing: -0.035em; color: var(--ink); }
  .s12 .body p + p { margin-top: 48px; }
  .s12 .body p.k { font-weight: 800; color: var(--ink-deep); }
  .s12 .sign { margin: 64px 90px 0; text-align: right; font-size: 32px; font-weight: 700; color: var(--ink-deep); }
</style></head>
<body>
<section class="sec s12 bg-soft">

  <p class="eyebrow">WHY WE TEACH</p>
  <h2 class="title"><span class="l">우리가 직접</span><br>기사를 키우는 이유</h2>
  <div class="body">
    <p>성수기마다 기사가 모자랐습니다.</p>
    <p class="k">일은 넘치는데 사람이 없다면, 사람을 키우면 됩니다.</p>
    <p>그래서 저희 현장 방식 그대로 가르치고, 저희 일감으로 시작하게 합니다.</p>
  </div>
  <p class="sign">— 올데이케어</p>
  <div class="next"><p>궁금한 건 여기서</p><i>↓</i></div>
</section>
</body></html>
