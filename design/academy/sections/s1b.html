<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s1b { padding-top: 64px; }
  .s1b .photo { height: 900px; object-position: center 22%; }
  .s1b .head { padding: 76px 30px 0; }
  .s1b .title { font-size: 76px; line-height: 1.22; }
  .s1b .title .l { font-weight: 300; }
  .s1b .basis { margin-top: 40px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; color: var(--sub); }
  .s1b .cols { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 40px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .s1b .cols div { padding: 34px 4px; font-size: 30px; font-weight: 700; letter-spacing: -0.045em; color: var(--ink-deep); }
  .s1b .cols div + div { border-left: 1px solid var(--line); }
</style></head>
<body>
<section class="sec s1b">
  <div class="cols"><div>교육비 0원</div><div>일감은 저희가</div><div>교육장 상시 개방</div></div>
  <div class="next"><p>정말일까요? 숫자로 보여드립니다</p><i>↓</i></div>
</section>
</body></html>
