<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s2 .head1 { margin-top: 72px; font-size: 44px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink-deep); }
  .s2 .head1 b { display: inline-block; font-size: 120px; line-height: 1; color: var(--yellow); letter-spacing: -0.05em; margin: 0 6px; vertical-align: -0.12em; }
  .s2 svg { display: block; width: 1000px; height: 410px; margin-top: 64px; }
  .s2 .band { margin-top: 56px; }
  .s2 svg .n { font: 700 28px Pretendard; fill: #1F2328; text-anchor: end; letter-spacing: -0.5px; }
  .s2 svg .k { font: 500 22px Pretendard; fill: #6E6E6A; }
  .s2 svg .v { font: 800 28px Pretendard; fill: #1F2328; letter-spacing: -0.5px; }
  .s2 svg .t { font: 800 24px Pretendard; fill: #1F2328; text-anchor: middle; }
  .s2 .note { margin: 30px 60px 0; font-size: 20px; line-height: 1.65; letter-spacing: -0.01em; color: var(--sub); }
</style></head>
<body>
<section class="sec s2">

  <p class="eyebrow">PROOF</p>
  <h2 class="title"><span class="l">극성수기,</span><br>실제 정산입니다</h2>
  <svg viewBox="0 0 1000 410">
    <text x="232" y="103" class="n">기사 A</text>
    <rect x="250" y="74" width="595.5" height="46" fill="#F2B705"/>

    <text x="232" y="177" class="n">기사 B</text>
    <rect x="250" y="148" width="569.1" height="46" fill="#F2B705"/>

    <rect x="250" y="222" width="563.9" height="46" fill="#F2B705"/>

</section>
