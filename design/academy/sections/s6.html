<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s6 .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 84px 40px 0; text-align: left; }
  .s6 .left { display: grid; grid-template-rows: 1fr 1fr; gap: 16px; }
  .s6 .box { padding: 44px 36px; border: 1px solid var(--line); }
  .s6 .box h3 { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; color: var(--sub); }
  .s6 .box p { margin-top: 18px; font-size: 30px; line-height: 1.5; letter-spacing: -0.035em; color: var(--sub); }
  .s6 .ours { background: var(--ink-deep); border-color: var(--ink-deep); display: flex; flex-direction: column; justify-content: center; }
  .s6 .ours h3 { color: var(--yellow); font-size: 48px; }
  .s6 .ours p { color: #FFFFFF; font-size: 32px; }
  .s6 .ours p b { font-weight: 800; color: var(--yellow); }
</style></head>
<body>
<section class="sec s6">

  <p class="eyebrow">THE REAL PROBLEM</p>
  <h2 class="title"><span class="l">기술을 배워도,</span><br>일이 없으면 소용없습니다</h2>
  <div class="cmp">
    <div class="left">
      <div class="box"><h3>학원</h3><p>수료증을 줍니다<br>그다음은 알아서</p></div>
      <div class="box"><h3>혼자 창업</h3><p>광고비부터 나갑니다<br>첫 고객까지 몇 달</p></div>
    </div>
    <div class="box ours"><h3>올데이케어</h3><p><b>일감을 드립니다</b></p><p>수료 평가 통과 즉시<br>콜 배정 시작</p></div>
  </div>
  <div class="next"><p>그래서 올데이케어는 일을 드립니다</p><i>↓</i></div>
</section>
</body></html>
