<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s6 .photo { height: 720px; margin-top: 76px; }
  .s6 .lead { margin-top: 64px; }
  .s6 .lead b { font-weight: 800; color: var(--ink-deep); }
  .s6 .flow { display: grid; grid-template-columns: repeat(4, 1fr); margin: 76px 40px 0; border-top: 1px solid var(--line); }
  .s6 .flow div { padding: 36px 8px 0; }
  .s6 .flow div + div { border-left: 1px solid var(--line); }
  .s6 .flow i { display: block; font-style: normal; font-size: 30px; font-weight: 800; color: var(--yellow-d); }
  .s6 .flow b { display: block; margin-top: 14px; font-size: 30px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.35; color: var(--ink-deep); }
</style></head>
<body>
<section class="sec s6">
  <p class="eyebrow">SOLUTION</p>
  <h2 class="title"><span class="l">일 걱정은</span><br>저희가 합니다</h2>
  <img class="full photo" src="../photos/a6_van.png" alt="">
  <p class="lead">광고 · 고객 · 일정 · 정산은 올데이케어가.<br><b>기사님은 현장만.</b></p>
  <div class="flow">
    <div><i>01</i><b>앱으로 콜 받기</b></div>
    <div><i>02</i><b>현장 작업</b></div>
    <div><i>03</i><b>사진으로 완료 보고</b></div>
    <div><i>04</i><b>투명한 정산</b></div>
  </div>
</section>
</body></html>
