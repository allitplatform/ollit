<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s9 .top { font-size: 72px; line-height: 1.22; letter-spacing: -0.045em; font-weight: 800; color: var(--ink-deep); }
  .s9 .top .l { font-weight: 300; }
  .s9 .photo { height: 640px; margin-top: 64px; }
  .s9 .pair { display: flex; gap: 8px; margin-top: 8px; }
  .s9 .pair img { display: block; width: 496px; height: 300px; object-fit: cover; }
  .s9 .cap { margin: 34px 60px 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink-deep); }
  .s9 .title { margin-top: 100px; }
  .s9 .checks li span b { display: block; font-size: 36px; }
  .s9 .checks li span em { display: block; margin-top: 6px; font-style: normal; font-size: 30px; color: var(--sub); }
  .s9 .checks li + li { margin-top: 34px; }
</style></head>
<body>
<section class="sec s9">
  <p class="eyebrow">AFTER THE COURSE</p>
  <p class="top" style="margin-top:28px"><span class="l">막히면 언제든,</span><br>여기서 다시</p>
  <img class="full photo" src="../photos/r27.jpg" alt="">
  <div class="pair"><img src="../photos/r03.jpg" alt=""><img src="../photos/r21.jpg" alt=""></div>
  <p class="cap">교육장 2곳 · 실습용 스탠드 · 벽걸이 · 천장형 상시 비치</p>
  <h2 class="title"><span class="l">수료하고 끝이</span><br>아닙니다</h2>
  <ul class="checks">
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span><b>교육장 상시 개방</b><em>막히면 언제든 와서 연습</em></span></li>
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span><b>수리 동행 심화 과정</b><em>활동하면서 수리까지</em></span></li>
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span><b>앱으로 콜 · 정산</b><em>내가 한 만큼 숫자로 확인</em></span></li>
    <li><svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg><span><b>비수기 일감</b><em>로봇청소기 · 난방 수리</em></span></li>
  </ul>
</section>
</body></html>
