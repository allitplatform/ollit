<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s1 { padding-top: 0; }
  .s1 .photo { height: 900px; object-position: center 22%; }
  .s1 .head { padding: 76px 30px 0; }
  .s1 .title { font-size: 76px; line-height: 1.22; }
  .s1 .title .l { font-weight: 300; }
  .s1 .basis { margin-top: 40px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; color: var(--sub); }
  .s1 .cols { display: grid; grid-template-columns: repeat(3, 1fr); margin: 64px 40px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .s1 .cols div { padding: 34px 4px; font-size: 30px; font-weight: 700; letter-spacing: -0.045em; color: var(--ink-deep); }
  .s1 .cols div + div { border-left: 1px solid var(--line); }
</style></head>
<body>
<section class="sec s1">

  <img class="full photo" src="../photos/h1_bright.png" alt="">
  <div class="head">
    <p class="eyebrow">ALLDAYCARE TECHNICIAN PROGRAM</p>

  </div>
  <div class="cols"><div>경력 없어도</div><div>일감은 저희가</div><div>교육장 2곳 상시 개방</div></div>
  <div class="next"><p>정말일까요? 숫자로 보여드립니다</p><i>↓</i></div>
</section>
</body></html>
