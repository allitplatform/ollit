<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s1 { padding: 0; }
  .s1 .head { padding: 84px 40px 0; }
  .s1 .who { margin-top: 26px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: var(--sub); }
  .s1 .k { margin-top: 56px; font-size: 40px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink-deep); }
  .s1 .num { margin-top: 8px; font-size: 200px; font-weight: 800; letter-spacing: -0.06em; line-height: 1.02; color: var(--ink-deep);
    text-decoration: underline; text-decoration-color: var(--yellow); text-decoration-thickness: 10px; text-underline-offset: 18px; text-decoration-skip-ink: none; }
  .s1 .num small { font-size: 96px; letter-spacing: -0.04em; }
  .s1 .basis { margin-top: 40px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; color: #9A9A96; }
  .s1 .photo { height: 760px; margin-top: 72px; object-position: center 62%; }
  .s1 .big { padding: 80px 40px 96px; font-size: 72px; line-height: 1.25; letter-spacing: -0.045em; font-weight: 800; color: var(--ink-deep); }
  .s1 .big .l { font-weight: 300; }
</style></head>
<body>
<section class="sec s1">
  <div class="head">
    <p class="eyebrow">ALLDAYCARE TECHNICIAN PROGRAM</p>
    <p class="who">올데이케어 직영기사 · 성수기</p>
    <p class="k">성수기 일 평균</p>
    <p class="num">34<small>만원</small></p>
    <p class="basis">2026년 6~8월 · 작업한 날 기준 · 올잇 정산(기사 지급액)</p>
  </div>
  <img class="full photo" src="../photos/r19.jpg" alt="">
  <p class="big"><span class="l">3주 배우고,</span><br>4주차부터 <span class="uline">일합니다</span></p>
</section>
</body></html>
