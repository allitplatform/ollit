<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s1 { padding: 0; }
  .s1 .head { padding: 90px 40px 70px; }
  .s1 .title { font-size: 80px; }
  .s1 .proof { margin: 48px auto 0; width: 840px; padding-top: 32px; border-top: 1px solid var(--line); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-deep); }
  .s1 .photo { height: 880px; object-position: center 22%; }
  .s1 .big { padding: 84px 40px 0; font-size: 72px; line-height: 1.25; letter-spacing: -0.045em; font-weight: 800; color: var(--ink-deep); }
  .s1 .big .l { font-weight: 300; }
  .s1 .cols { display: grid; grid-template-columns: repeat(3, 1fr); margin: 76px 40px 0; padding: 0 0 96px; }
  .s1 .cols div { font-size: 32px; font-weight: 700; letter-spacing: -0.04em; color: var(--ink-deep); padding: 10px 0; }
  .s1 .cols div + div { border-left: 1px solid var(--line); }
</style></head>
<body>
<section class="sec s1">
  <div class="head">
    <p class="eyebrow">ALLDAYCARE TECHNICIAN PROGRAM</p>
    <h1 class="title"><span class="l">에어컨 기사,</span><br>월 1,000만원을 넘기는<br>사람들이 있습니다</h1>
    <p class="proof">2026년 8월 · 협력기사 A · 월 정산 1,485만원 (올잇 정산 기준)</p>
  </div>
  <img class="full photo" src="../photos/a1_hero.png" alt="">
  <p class="big"><span class="l">3주 배우고,</span><br>4주차부터 <span class="uline">일합니다</span></p>
  <div class="cols"><div>경력 없어도</div><div>일감은 저희가</div><div>교육장 상시 개방</div></div>
</section>
</body></html>
