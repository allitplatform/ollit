<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s7 .photo { height: 700px; margin-top: 76px; object-position: center 60%; }
  .s7 .grp { margin: 76px 40px 0; text-align: left; }
  .s7 .grp + .grp { margin-top: 64px; }
  .s7 .gh { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink-deep); padding-bottom: 18px; border-bottom: 3px solid var(--yellow); }
  .s7 .weeks { text-align: left; }
  .s7 .grp.after { opacity: 0.5; }
  .s7 .grp.after .gh { border-bottom-color: var(--line); color: var(--sub); }
  .s7 .wk { display: flex; padding: 44px 0; border-bottom: 1px solid var(--line); }
  .s7 .wk .n { flex: 0 0 120px; padding-right: 20px; margin-right: 24px; border-right: 1px solid var(--line); font-size: 40px; font-weight: 800; letter-spacing: -0.04em; color: var(--yellow-d); }
  .s7 .wk .b { flex: 1; }
  .s7 .wk b { display: block; font-size: 38px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink-deep); }
  .s7 .wk p { margin-top: 12px; font-size: 30px; line-height: 1.55; letter-spacing: -0.035em; color: var(--sub); }
  .s7 .wk .ph { display: flex; gap: 8px; margin-top: 26px; }
  .s7 .wk .ph img { display: block; height: 300px; object-fit: cover; }
  .s7 .big { margin-top: 72px; font-size: 64px; line-height: 1.3; letter-spacing: -0.045em; font-weight: 800; color: var(--ink-deep); }
  .s7 .big .l { font-weight: 300; }
  .s7 .small { margin-top: 40px; font-size: 28px; letter-spacing: -0.03em; color: var(--sub); }
</style></head>
<body>
<section class="sec s7">

  <p class="eyebrow">1 WEEK</p>
  <h2 class="title"><span class="l">일주일,</span><br>현장에서 바로 쓰는 것만</h2>
  <img class="full photo" src="../photos/v4_r18.jpg" alt="">
  <div class="grp">
    <p class="gh">일주일 기본</p>
    <div class="weeks">
      <div class="wk"><div class="n">1단계</div><div class="b"><b>벽걸이</b><p>구조 · 공구 · 안전<br>분해 → 세척 → 조립 반복<br>단독 테스트</p><div class="ph"><img src="../photos/v4_r23.jpg" alt="" style="width:402px"><img src="../photos/v4_r13.jpg" alt="" style="width:402px"></div></div></div>
      <div class="wk"><div class="n">2단계</div><div class="b"><b>스탠드 · 천장형</b><p>3종 세척<br>냉매 기초(게이지 · 압력 점검)</p><div class="ph"><img src="../photos/v4_r16.jpg" alt="" style="width:265px"><img src="../photos/v4_r20.jpg" alt="" style="width:265px"><img src="../photos/v4_r22.jpg" alt="" style="width:265px"></div></div></div>
    </div>
  </div>
  <p class="big"><span class="l">수료 평가 통과 →</span><br><span class="uline">바로 콜 배정 시작</span></p>
  <div class="grp after">
    <p class="gh">수료 후 · 별도 과정</p>
    <div class="weeks">
      <div class="wk"><div class="n">실전</div><div class="b"><b>현장에서 더 배우기</b><p>로봇청소기<br>고객응대 · 분쟁 예방<br>실제 현장 동행</p><div class="ph"><img src="../photos/v4_r24.jpg" alt="" style="width:402px"><img src="../photos/v4_r15.jpg" alt="" style="width:402px"></div></div></div>
    </div>
  </div>
  <div class="next"><p>끝나도 혼자가 아닙니다</p><i>↓</i></div>
</section>
</body></html>
