<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s7 .legend { display: flex; justify-content: center; gap: 30px; margin-top: 64px; font-size: 26px; font-weight: 600; color: var(--sub); }
  .s7 .legend span { display: inline-flex; align-items: center; gap: 10px; }
  .s7 .legend i { display: inline-block; width: 22px; height: 22px; }
  .s7 svg { display: block; width: 1000px; height: 680px; margin-top: 20px; }
  .s7 svg .v { font: 700 22px Pretendard; fill: #1F2328; text-anchor: middle; }
  .s7 svg .nd { font: 600 20px Pretendard; fill: #9A9A96; text-anchor: middle; }
  .s7 svg .m { font: 600 24px Pretendard; fill: #6E6E6A; text-anchor: middle; }
  .s7 svg .s1 { font: 800 44px Pretendard; fill: #1F2328; text-anchor: middle; letter-spacing: -1.5px; }
  .s7 svg .s2 { font: 600 26px Pretendard; fill: #6E6E6A; text-anchor: middle; letter-spacing: -0.8px; }
  .s7 .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 40px 40px 0; text-align: left; }
  .s7 .cards > div { padding: 40px 36px 42px; }
  .s7 .cards .s { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
  .s7 .cards .s small { font-size: 26px; font-weight: 600; margin-left: 6px; }
  .s7 .cards b { display: block; margin-top: 18px; font-size: 64px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  .s7 .cards .d { margin-top: 18px; font-size: 28px; font-weight: 600; letter-spacing: -0.035em; }
  .s7 .c-sum { background: #1F2328; color: #F2B705; }
  .s7 .c-aut { background: #F2B705; color: #1F2328; }
  .s7 .c-win { background: #FFF7DB; color: #1F2328; }
  .s7 .c-spr { background: #FFFFFF; color: #1F2328; border: 1px solid #E4E4E1; }
  .s7 .src { margin: 30px 50px 0; font-size: 20px; line-height: 1.6; color: #9A9A96; }
  .s7 .foot { margin: 60px 80px 0; padding-top: 44px; border-top: 1px solid var(--line); font-size: 32px; line-height: 1.55; letter-spacing: -0.035em; color: var(--ink-deep); }
  .s7 .foot b { font-weight: 800; }
</style></head>
