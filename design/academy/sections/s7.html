<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .s7 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 84px; }
  .s7 figure { text-align: left; }
  .s7 figure img { display: block; width: 494px; height: 560px; object-fit: cover; object-position: center 30%; }
  .s7 figcaption { padding: 22px 24px 30px; font-size: 30px; font-weight: 500; letter-spacing: -0.035em; color: var(--sub); }
  .s7 figcaption b { font-weight: 800; color: var(--ink-deep); margin-right: 10px; }
  .s7 .foot { margin: 48px 80px 0; padding-top: 44px; border-top: 1px solid var(--line); font-size: 32px; line-height: 1.55; letter-spacing: -0.035em; color: var(--ink-deep); }
  .s7 .foot b { font-weight: 800; }
</style></head>
<body>
<section class="sec s7">
  <p class="eyebrow">ALL YEAR ROUND</p>
  <h2 class="title"><span class="l">여름에만 버는 일이</span><br>아닙니다</h2>
  <div class="grid">
    <figure><img src="../photos/a7_summer.png" alt=""><figcaption><b>여름</b>에어컨 세척 성수기</figcaption></figure>
    <figure><img src="../photos/a7_autumn.png" alt=""><figcaption><b>가을</b>점검 · 수리</figcaption></figure>
    <figure><img src="../photos/a7_winter.png" alt=""><figcaption><b>겨울</b>로봇청소기 · 난방 수리</figcaption></figure>
    <figure><img src="../photos/a7_spring.png" alt=""><figcaption><b>봄</b>세척 시즌 개막</figcaption></figure>
  </div>
  <p class="foot">여름 하나만 보고 시작하지 마세요.<br><b>1년 내내 일하는 구조입니다.</b></p>
</section>
</body></html>
