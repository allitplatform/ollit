<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon — 기본=핑크(올잇 PWA). 올데이케어.kr 호스트는 middleware.js 가 -allday(파란 A) 로 치환. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF1B8D" />
    <meta name="description" content="현장과 사람을 잇는 운영 플랫폼" />

    <!-- PWA 설정 -->
    <!-- 2026-10-01 — /mkt 로 들어오면 처음부터 마케팅 앱 설정을 쓴다. 화면이 뜬 뒤에 바꾸면 폰이 이미 '올잇' 설정으로 홈 화면에 추가해 버려
         저장한 아이콘이 올잇 앱(/)으로 열렸다. 그래서 HTML 을 읽는 순간 경로를 보고 manifest·아이콘 이름을 정한다. -->
    <script>
      (function () {
        var mkt = /^\/mkt(\/|$)/.test(location.pathname);
        document.write(
          '<link rel="manifest" href="' + (mkt ? '/mkt-manifest.json' : '/manifest.json') + '" />' +
          '<link rel="apple-touch-icon" sizes="180x180" href="' + (mkt ? '/icon-ads-180.png' : '/icon-180.png') + '" />' +
          '<meta name="apple-mobile-web-app-title" content="' + (mkt ? '올잇마케팅' : '올잇') + '" />'
        );
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- V14 — Pretendard 한국어 최적화 폰트 (weight 100~900) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 2026-06-23 — 랜딩 페이지용 Noto Sans KR (design handoff) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" />

    <!-- Open Graph (카톡/페이스북 미리보기) -->
    <meta property="og:title" content="올잇 - 현장과 사람을 잇는" />
    <meta property="og:description" content="현장과 사람을 잇는 운영 플랫폼" />
    <meta property="og:image" content="https://ollit.vercel.app/icon-512.png" />
    <meta property="og:url" content="https://ollit.vercel.app" />
    <meta property="og:type" content="website" />

    <title>올잇 - 현장과 사람을 잇는</title>
    <!-- 2026-07-26 부정클릭 감시 1단계: 랜딩(올데이케어.kr / /landing) 방문만 서버에 기록 -->
    <script>
      (function () {
        try {
          var h = location.hostname, p = location.pathname;
          var isLanding = h.indexOf("xn--") === 0 || h.indexOf("올데이케어") >= 0 || p.indexOf("/landing") === 0;
          if (!isLanding) return;
          var u = "/api/click-log?qs=" + encodeURIComponent(location.search.slice(1, 400))
                + "&ref=" + encodeURIComponent((document.referrer || "").slice(0, 200));
          navigator.sendBeacon ? navigator.sendBeacon(u) : fetch(u, { method: "GET", keepalive: true });
        } catch (e) {}
      })();
    </script>
    <!-- Danggeun Market Code — 2026-10-08 당근 전환 추적. 랜딩(올데이케어.kr / /landing)에서만 로드, 운영 PWA 화면은 제외 (main.jsx _isLandingRoute 와 같은 조건) -->
    <script>
      (function (w, d) {
        var h = (location.hostname || "").toLowerCase(), p = location.pathname || "";
        var isLanding = h.indexOf("alldaycare") >= 0 || h.indexOf("xn--2n1bk06aikal6b92t") >= 0 || h.indexOf("올데이케어") >= 0
                     || p.indexOf("/landing") === 0 || p.indexOf("/privacy") === 0 || location.search.indexOf("page=landing") >= 0;
        if (!isLanding || w.karrotPixel) return;
        var k = { stub: true, queue: [] };
        k.init = function () { k.queue.push(['init', arguments, Date.now()]); };
        k.track = function () { k.queue.push(['track', arguments, Date.now()]); };
        w.karrotPixel = k;
        var s = d.createElement('script');
        s.async = true;
        s.src = 'https://karrot-pixel.business.daangn.com/karrot-pixel.js';
        var f = d.getElementsByTagName('script')[0];
        f && f.parentNode ? f.parentNode.insertBefore(s, f) : d.head.appendChild(s);
        w.karrotPixel.init('1791458572657527001');
        w.karrotPixel.track('ViewPage');
        // 전환 이벤트 — 전화걸기 · 카톡 문의 버튼 클릭 시 Lead (접수 완료 SubmitApplication 은 LandingApp.jsx handleSubmit)
        d.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
          if (!a) return;
          var href = a.getAttribute('href') || '';
          if (/^tel:/i.test(href) || /kakao/i.test(href)) {
            try { w.karrotPixel.track('Lead'); } catch (err) {}
          }
        }, true);
      })(window, document);
    </script>
    <!-- End Danggeun Market Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
