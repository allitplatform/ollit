<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon — 기본=핑크(올잇 PWA). 올데이케어.kr 호스트는 middleware.js 가 -allday(파란 A) 로 치환. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF1B8D" />
    <meta name="description" content="현장과 사람을 잇는 운영 플랫폼" />

    <!-- PWA 설정 -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="올잇" />

    <!-- V14 — Pretendard 한국어 최적화 폰트 (weight 100~900) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 2026-06-23 — 랜딩 페이지용 Noto Sans KR (design handoff) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" />

    <!-- Open Graph (카톡/페이스북 미리보기) -->
    <meta property="og:title" content="올잇 - 현장과 사람을 잇는" />
    <meta property="og:description" content="현장과 사람을 잇는 운영 플랫폼" />
    <meta property="og:image" content="https://ollit.vercel.app/icon-512.png" />
    <meta property="og:url" content="https://ollit.vercel.app" />
    <meta property="og:type" content="website" />

    <title>올잇 - 현장과 사람을 잇는</title>
    <!-- 2026-07-26 부정클릭 감시 1단계: 랜딩(올데이케어.kr / /landing) 방문만 서버에 기록 -->
    <script>
      (function () {
        try {
          var h = location.hostname, p = location.pathname;
          var isLanding = h.indexOf("xn--") === 0 || h.indexOf("올데이케어") >= 0 || p.indexOf("/landing") === 0;
          if (!isLanding) return;
          var u = "/api/click-log?qs=" + encodeURIComponent(location.search.slice(1, 400))
                + "&ref=" + encodeURIComponent((document.referrer || "").slice(0, 200));
          navigator.sendBeacon ? navigator.sendBeacon(u) : fetch(u, { method: "GET", keepalive: true });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
